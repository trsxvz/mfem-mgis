name: Set up ccache
description: >
  Install ccache and restore the compilations cached by the previous runs under the
  given key, made on the same processor when the compilations use -march=native.
  save-ccache saves them at the end of the job.
inputs:
  key:
    description: name of the cache, e.g. the build type
    required: true
  march-native:
    description: whether the compilations use -march=native
    default: "true"
runs:
  using: composite
  steps:
  - name: Install ccache
    shell: bash
    run: |
      sudo apt-get update
      sudo apt-get install -y ccache
      echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> $GITHUB_ENV
      # an upper bound, in addition to the removal of the unused files by save-ccache
      echo "CCACHE_MAXSIZE=500M" >> $GITHUB_ENV
      # start of the job, see save-ccache
      echo "CCACHE_START=$(date +%s)" >> $GITHUB_ENV
      echo "CCACHE_KEY=ccache-${{ inputs.key }}" >> $GITHUB_ENV
  - name: Take the processor into account
    if: inputs.march-native == 'true'
    shell: bash
    run: |
      echo "Processor:$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"
      # the ccache of Ubuntu 24.04 (4.9) does not expand -march=native, unlike ccache 4.12:
      # hash the options it stands for on this processor, so that the objects built on
      # another processor are never reused
      gcc -march=native -### -E - < /dev/null 2>&1 | grep cc1 > $RUNNER_TEMP/march-native.txt
      echo "CCACHE_EXTRAFILES=$RUNNER_TEMP/march-native.txt" >> $GITHUB_ENV
      # and only restore the compilations made on the same processor, the runners having
      # several ones
      echo "CCACHE_KEY=$CCACHE_KEY-$(sha256sum < $RUNNER_TEMP/march-native.txt | cut -c1-8)" >> $GITHUB_ENV
  - name: Name the cache
    id: key
    shell: bash
    run: echo "key=$CCACHE_KEY" >> $GITHUB_OUTPUT
  - uses: actions/cache/restore@v6
    with:
      path: ${{ runner.temp }}/ccache
      key: ${{ steps.key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      restore-keys: ${{ steps.key.outputs.key }}-
  # restored with the cache, then shown by save-ccache for this job only
  - name: Reset the statistics
    shell: bash
    run: ccache --zero-stats
